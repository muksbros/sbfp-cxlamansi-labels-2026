<head>
<meta charset="UTF-8"/>

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    font-family:'Barlow',sans-serif;
    background:#1a3a1a;
    padding:12px;
  }

  /* CONTROLS */
  .controls{
    background:#0d2b0d;color:#fff;
    padding:10px 16px;margin-bottom:12px;
    border-radius:5px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;
    letter-spacing:.05em;text-transform:uppercase;
    border:1px solid #2d6b2d;
  }
  .controls select{
    font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;
    text-transform:uppercase;letter-spacing:.04em;
    padding:6px 12px;border-radius:4px;border:1px solid #2d6b2d;cursor:pointer;
    background:#0d2b0d;color:#fff;
  }
  .controls button{
    font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;
    padding:6px 16px;border-radius:4px;border:2px solid #4caf50;
    cursor:pointer;background:#4caf50;color:#fff;
  }
  .controls button:hover{background:#45a049;}
  .ctrl-stat{color:#7bc97e;font-size:11px;}

  /* TABS BAR */
  .tab-bar{
    display:flex;flex-direction:column;gap:6px;
    margin-bottom:10px;
    padding:8px;
    background:#0d2b0d;
    border-radius:6px;
    border:1px solid #2d6b2d;
  }
  .truck-group{
    display:flex;flex-wrap:wrap;gap:4px;align-items:center;
    padding:5px 7px;border-radius:4px;
  }
  .truck-group.t1{ background:#0a1f2e; border-left:3px solid #1e88e5; }
  .truck-group.t2{ background:#1a1a0a; border-left:3px solid #f9a825; }
  .truck-group.t3{ background:#1a0a1a; border-left:3px solid #ab47bc; }
  .truck-label{
    font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:900;
    text-transform:uppercase;letter-spacing:.1em;
    white-space:nowrap;padding:2px 6px 2px 0;margin-right:2px;
    border-right:1px solid #333;
  }
  .truck-group.t1 .truck-label{ color:#1e88e5; }
  .truck-group.t2 .truck-label{ color:#f9a825; }
  .truck-group.t3 .truck-label{ color:#ab47bc; }
  .tab-btn{
    font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;
    text-transform:uppercase;letter-spacing:.06em;
    padding:4px 10px;border-radius:3px;
    cursor:pointer;white-space:nowrap;transition:all .15s;
  }
  .truck-group.t1 .tab-btn{ border:1px solid #1565c0;background:#0d2744;color:#90caf9; }
  .truck-group.t1 .tab-btn:hover{ background:#1565c0;color:#fff; }
  .truck-group.t1 .tab-btn.active{ background:#1e88e5;color:#fff;border-color:#1e88e5; }
  .truck-group.t2 .tab-btn{ border:1px solid #b07d00;background:#2a2000;color:#ffe082; }
  .truck-group.t2 .tab-btn:hover{ background:#b07d00;color:#fff; }
  .truck-group.t2 .tab-btn.active{ background:#f9a825;color:#000;border-color:#f9a825; }
  .truck-group.t3 .tab-btn{ border:1px solid #7b1fa2;background:#21002a;color:#ce93d8; }
  .truck-group.t3 .tab-btn:hover{ background:#7b1fa2;color:#fff; }
  .truck-group.t3 .tab-btn.active{ background:#ab47bc;color:#fff;border-color:#ab47bc; }
  .tab-section{display:none;}
  .tab-section.visible{display:block;}

  /* TAB HEADER */
  .tab-header{
    background:#163316;color:#9dd49f;
    padding:6px 12px;margin-bottom:0;
    border-radius:4px 4px 0 0;border-left:4px solid #4caf50;
    font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;
    text-transform:uppercase;letter-spacing:.08em;
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  }
  .tab-header span{color:#4caf50;}

  /* DROP-OFF INFO TABLE */
  .drop-info{
    background:#0f1f0f;
    border:1px solid #2d6b2d;border-top:none;
    border-radius:0 0 4px 4px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .drop-info-toggle{
    font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;
    text-transform:uppercase;letter-spacing:.08em;
    color:#7bc97e;background:none;border:none;cursor:pointer;
    padding:5px 12px;display:block;width:100%;text-align:left;
    border-top:1px solid #1a4a1a;
  }
  .drop-info-toggle:hover{color:#fff;background:#163316;}
  .drop-info-table-wrap{display:none;padding:0 10px 10px;}
  .drop-info-table-wrap.open{display:block;}
  .drop-info-table{
    width:100%;border-collapse:collapse;
    font-family:'Barlow Condensed',sans-serif;font-size:11px;
  }
  .drop-info-table th{
    font-weight:900;text-transform:uppercase;letter-spacing:.08em;
    color:#4caf50;font-size:10px;
    padding:5px 8px;border-bottom:1px solid #2d6b2d;
    text-align:left;
  }
  .drop-info-table th.num{text-align:right;}
  .drop-info-table td{
    padding:4px 8px;color:#ccc;font-size:11px;
    border-bottom:1px solid #1a3a1a;
  }
  .drop-info-table td.num{text-align:right;color:#fff;font-weight:700;}
  .drop-info-table td.cases{text-align:right;color:#7bc97e;font-weight:700;}
  .drop-info-table td.loose-cell{text-align:right;color:#f9a825;font-weight:700;}
  .drop-info-table tr:last-child td{border-bottom:none;}
  .drop-info-table tr.total-row td{
    border-top:2px solid #2d6b2d;border-bottom:none;
    background:#163316;color:#fff;font-weight:900;font-size:12px;
    padding:6px 8px;
  }
  .drop-info-table tr.total-row td.cases{color:#4caf50;}
  .drop-info-table tr.total-row td.loose-cell{color:#f9a825;}
  @media print{
    .drop-info{display:none;}
  }

  /* A4 PAGE — 2 cols × 4 rows = 8 labels */
  .page{
    width:210mm;
    min-height:297mm;
    background:#fff;
    margin:0 auto 12px;
    padding:4mm;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:repeat(4,1fr);
    gap:2.5mm;
    page-break-after:always;
    break-after:page;
  }

  /* LABEL */
  .lbl{
    border:1.5px solid #000;
    border-radius:2px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
    background:#fff;
    min-height:0;
  }

  /* TOP BANNER — white bg with DepEd logo */
  .lbl-banner{
    background:#fff;color:#000;
    display:flex;align-items:center;justify-content:center;
    gap:4px;
    padding:2px 5px;
    flex-shrink:0;
    border-bottom:1.5px solid #000;
  }
  .lbl-banner-text{
    font-family:'Barlow Condensed',sans-serif;
    font-size:6pt;font-weight:900;
    letter-spacing:.1em;text-transform:uppercase;
    color:#000;line-height:1.3;
    text-align:left;
  }
  .lbl-banner-text .nfs{
    font-size:5pt;color:#c0392b;font-weight:800;letter-spacing:.06em;
    display:block;
  }

  /* PRODUCT STRIP */
  .lbl-product{
    background:#fff;color:#000;
    text-align:center;
    font-family:'Barlow Condensed',sans-serif;
    font-size:7.5pt;font-weight:900;
    letter-spacing:.1em;text-transform:uppercase;
    padding:2px 4px;line-height:1.2;
    flex-shrink:0;
    border-bottom:1.5px solid #000;
  }

  /* DELIVERY + TRUCK STRIP */
  .lbl-prog{
    background:#f0f0f0;color:#000;
    text-align:center;
    font-family:'Barlow Condensed',sans-serif;
    font-size:5.5pt;font-weight:800;
    letter-spacing:.08em;text-transform:uppercase;
    padding:2px 4px;line-height:1;
    flex-shrink:0;
    border-bottom:1px solid #bbb;
  }

  /* DROP-OFF */
  .lbl-dropoff{
    padding:2px 6px 1px;
    border-bottom:1px solid #ccc;
    flex-shrink:0;
    background:#f8f8f8;
  }
  .do-eyebrow{
    font-family:'Barlow Condensed',sans-serif;
    font-size:5pt;font-weight:700;
    text-transform:uppercase;letter-spacing:.1em;color:#555;
    line-height:1;
  }
  .do-name{
    font-family:'Barlow Condensed',sans-serif;
    font-size:7.5pt;font-weight:800;
    text-transform:uppercase;color:#000;
    line-height:1.1;
  }

  /* SCHOOL — center hero */
  .lbl-school{
    flex:1;
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    padding:2px 5px;
    text-align:center;
    border-bottom:1px solid #000;
    min-height:0;
  }
  .sch-eyebrow{
    font-family:'Barlow Condensed',sans-serif;
    font-size:5pt;font-weight:700;
    text-transform:uppercase;letter-spacing:.1em;color:#555;
    line-height:1;
  }
  .sch-name{
    font-family:'Barlow Condensed',sans-serif;
    font-size:15pt;font-weight:900;
    text-transform:uppercase;
    color:#000;line-height:1.05;
  }
  .sch-allot{
    font-family:'Barlow Condensed',sans-serif;
    font-size:5pt;color:#555;font-weight:600;
    margin-top:1px;line-height:1.2;
  }

  /* QUANTITY BAR */
  .lbl-qty{
    display:flex;align-items:stretch;
    flex-shrink:0;
    background:#fff;color:#000;border-top:1.5px solid #000;
  }
  .qty-main{
    flex:1;
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    padding:4px 3px;
    border-right:1px solid #ccc;
    background:#f0f0f0;
  }
  .qty-num{
    font-family:'Barlow Condensed',sans-serif;
    font-size:17pt;font-weight:900;
    color:#000;line-height:1;
  }
  .qty-unit{
    font-family:'Barlow Condensed',sans-serif;
    font-size:5.5pt;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:#333;
  }
  .qty-side{
    display:flex;flex-direction:column;
    justify-content:center;
    padding:3px 6px;
    text-align:right;
    min-width:46px;
    background:#fff;
  }
  .qty-boxlabel{
    font-family:'Barlow Condensed',sans-serif;
    font-size:7.5pt;font-weight:900;
    text-transform:uppercase;color:#000;
  }
  .qty-of{
    font-family:'Barlow Condensed',sans-serif;
    font-size:5pt;font-weight:600;color:#555;
  }
  .qty-loose-note{
    font-family:'Barlow Condensed',sans-serif;
    font-size:5pt;font-weight:700;color:#333;
  }

  /* Corner badge */
  .corner-badge{
    position:absolute;top:0;right:0;
    background:#000;color:#fff;
    font-family:'Barlow Condensed',sans-serif;
    font-size:5pt;font-weight:800;
    text-transform:uppercase;letter-spacing:.05em;
    padding:1px 5px;
    border-bottom-left-radius:2px;
    border-left:1px solid #333;
    border-bottom:1px solid #333;
    line-height:1.4;
  }

  /* LOOSE — dashed border */
  .lbl.loose{ border-style:dashed;border-color:#555; }
  .lbl.loose .lbl-banner{background:#f5f5f5;border-bottom-color:#555;}
  .lbl.loose .lbl-qty{background:#f5f5f5;border-top:1.5px dashed #555;}
  .lbl.loose .qty-main{background:#f5f5f5;}
  .lbl.loose .corner-badge{background:#333;color:#fff;}

  @media print{
    body{background:#fff;padding:0;}
    .controls,.tab-bar,.tab-header{display:none;}
    .tab-section{display:none!important;}
    .tab-section.printing{display:block!important;}
    .page{margin:0;}
  }
</style>
</head>

function buildDropLabels(drop, truck, progTag) {
  const CASE = getCase();
  const out = [];
  drop.schools.forEach(s => {
    if (s.q <= 0) return;
    const full = Math.floor(s.q / CASE);
    const loose = s.q % CASE;
    const total = full + (loose > 0 ? 1 : 0);
    for (let b = 1; b <= full; b++) {
      out.push({ type:'full', prog:progTag, truck:truck.label, route:truck.route,
        drop:drop.drop, dn:drop.dn, school:s.n, qty:CASE,
        boxNum:b, totalBoxes:total, full, loose, schoolTotal:s.q, caseSize:CASE });
    }
    if (loose > 0) {
      out.push({ type:'loose', prog:progTag, truck:truck.label, route:truck.route,
        drop:drop.drop, dn:drop.dn, school:s.n, qty:loose,
        boxNum:full+1, totalBoxes:total, full, loose, schoolTotal:s.q, caseSize:CASE });
    }
  });
  return out;
}

function makeLbl(l) {
  const isLoose = l.type === 'loose';
  const progLine = l.prog === 'summer'
    ? 'Summer Feeding Program 2026'
    : '5th &amp; 6th Delivery 2026';
  const allot = `${l.schoolTotal.toLocaleString()} pcs total · ${l.full} case${l.full!==1?'s':''}${l.loose>0?' + '+l.loose+' pcs loose':''}`;

  return `<div class="lbl${isLoose?' loose':''}">
    <div class="corner-badge">${isLoose ? 'LOOSE' : l.boxNum+'/'+l.totalBoxes}</div>
    <div class="lbl-banner">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 38" width="54" height="17" style="flex-shrink:0">
        <!-- "Dep" in blue -->
        <text x="0" y="30" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="32" fill="#1a3a8f" letter-spacing="-1">D</text>
        <text x="22" y="30" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="32" fill="#1a3a8f" letter-spacing="-1">e</text>
        <!-- p body without vertical stem (torch replaces it) -->
        <text x="40" y="30" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="32" fill="#1a3a8f" letter-spacing="-1">p</text>
        <!-- "ED" in red -->
        <text x="60" y="30" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="32" fill="#c0392b" letter-spacing="-1">E</text>
        <text x="82" y="30" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="32" fill="#c0392b" letter-spacing="-1">D</text>
        <!-- Torch flame over the p stem -->
        <ellipse cx="50" cy="7" rx="3.5" ry="5" fill="#f9a825" opacity=".95"/>
        <ellipse cx="50" cy="9" rx="2" ry="3.5" fill="#e65100"/>
        <ellipse cx="50" cy="6" rx="1.5" ry="3" fill="#fff176"/>
      </svg>
      <div class="lbl-banner-text">
        SBFP · Republic of the Philippines
        <span class="nfs">NOT FOR SALE</span>
      </div>
    </div>
    <div class="lbl-product">Calamansi Juice — ${l.caseSize} pcs / case</div>
    <div class="lbl-prog">${progLine} &nbsp;·&nbsp; ${l.truck} — ${l.route}</div>
    <div class="lbl-dropoff">
      <div class="do-eyebrow">Drop-off #${l.dn}</div>
      <div class="do-name">${l.drop}</div>
    </div>
    <div class="lbl-school">
      <div class="sch-eyebrow">Recipient School</div>
      <div class="sch-name">${l.school}</div>
      <div class="sch-allot">${allot}</div>
    </div>
    <div class="lbl-qty">
      <div class="qty-main">
        <div class="qty-num">${l.qty.toLocaleString()}</div>
        <div class="qty-unit">pcs · ${isLoose?'loose':'full case'}</div>
      </div>
      <div class="qty-side">
        <div class="qty-boxlabel">${isLoose?'LOOSE':'CASE '+l.boxNum}</div>
        <div class="qty-of">of ${l.totalBoxes}</div>
        ${l.loose>0?`<div class="qty-loose-note">+${l.loose} loose</div>`:''}
      </div>
    </div>
  </div>`;
}

function buildTabs() {
  const CASE = getCase();
  const delivery = document.getElementById('selDelivery').value;
  const truckFilter = document.getElementById('selTruck').value;
  const trucks = delivery === 'summer' ? SUMMER : DOUBLE;
  const progTag = delivery === 'summer' ? 'summer' : 'double';
  const progLabel = delivery === 'summer' ? 'Summer Feeding 2026' : '5th & 6th Delivery 2026';

  // Build tab buttons grouped by truck
  const tabBar = document.getElementById('tabBar');
  tabBar.innerHTML = '';

  const container = document.getElementById('pages');
  container.innerHTML = '';

  let totalLabels = 0;
  let firstTabSet = false;

  trucks.forEach(truck => {
    if (truckFilter !== 'all' && truck.id !== truckFilter) return;

    // Truck group row
    const group = document.createElement('div');
    group.className = `truck-group ${truck.id}`;

    const lbl = document.createElement('span');
    lbl.className = 'truck-label';
    lbl.textContent = `🚛 ${truck.label} — ${truck.route}`;
    group.appendChild(lbl);

    truck.drops.forEach((d, dIdx) => {
      const globalIdx = `${truck.id}-${dIdx}`;
      const tabId = `tab-${globalIdx}`;
      const labels = buildDropLabels(d, truck, progTag);
      totalLabels += labels.length;

      const isFirst = !firstTabSet;
      if (isFirst) firstTabSet = true;

      // Tab button
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (isFirst ? ' active' : '');
      btn.textContent = `#${d.dn} ${d.drop}`;
      btn.title = `${truck.label} · ${labels.length} labels`;
      btn.dataset.tabid = tabId;
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('visible'));
        document.getElementById(tabId).classList.add('visible');
      };
      group.appendChild(btn);

      // Tab section
      const section = document.createElement('div');
      section.className = 'tab-section' + (isFirst ? ' visible' : '');
      section.id = tabId;

      const totalQ = d.schools.reduce((a,s) => a+s.q, 0);
      const fullCases = Math.floor(totalQ / CASE);
      const looseRem = totalQ % CASE;

      // Build school rows for info table
      const schoolRows = d.schools.map((s,i) => {
        const sf = Math.floor(s.q / CASE);
        const sl = s.q % CASE;
        return `<tr>
          <td>${i+1}</td>
          <td>${s.n}</td>
          <td class="num">${s.q.toLocaleString()}</td>
          <td class="cases">${sf > 0 ? sf+' case'+(sf!==1?'s':'') : '—'}</td>
          <td class="loose-cell">${sl > 0 ? sl+' pcs' : '—'}</td>
        </tr>`;
      }).join('');

      const infoId = `info-${tabId}`;
      section.innerHTML = `<div class="tab-header">
        <span>🍋 Drop-off #${d.dn}: ${d.drop}</span>
        &nbsp;·&nbsp; ${truck.label} — ${truck.route}
        &nbsp;·&nbsp; ${progLabel}
        &nbsp;·&nbsp; <span>${d.schools.length} school${d.schools.length!==1?'s':''}</span>
        &nbsp;·&nbsp; ${totalQ.toLocaleString()} pcs total
        &nbsp;·&nbsp; <span>${fullCases} full cases${looseRem>0?' + '+looseRem+' pcs loose':''}</span>
        &nbsp;·&nbsp; ${labels.length} labels · ${Math.ceil(labels.length/8)} page${Math.ceil(labels.length/8)!==1?'s':''}
        &nbsp;&nbsp;<button onclick="printActiveTab()" style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 12px;border-radius:3px;border:2px solid #4caf50;cursor:pointer;background:#4caf50;color:#fff;">🖨 This Tab</button>
        <button onclick="doPrint('truck')" style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 12px;border-radius:3px;border:2px solid #1e88e5;cursor:pointer;background:#1e88e5;color:#fff;">🚛 This Truck</button>
        <button onclick="doPrint('all')" style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 12px;border-radius:3px;border:2px solid #ab47bc;cursor:pointer;background:#ab47bc;color:#fff;">📦 All Trucks</button>
      </div>
      <div class="drop-info">
        <button class="drop-info-toggle" onclick="toggleInfo('${infoId}')">▶ Show School Breakdown — ${d.schools.length} schools · ${totalQ.toLocaleString()} pcs · ${fullCases} cases${looseRem>0?' + '+looseRem+' loose':''}</button>
        <div class="drop-info-table-wrap" id="${infoId}">
          <table class="drop-info-table">
            <thead><tr>
              <th>#</th>
              <th>School</th>
              <th class="num">Qty (pcs)</th>
              <th class="num">Full Cases</th>
              <th class="num">Loose</th>
            </tr></thead>
            <tbody>${schoolRows}</tbody>
            <tfoot><tr class="total-row">
              <td colspan="2">TOTAL — ${d.schools.length} schools</td>
              <td class="num">${totalQ.toLocaleString()} pcs</td>
              <td class="cases">${fullCases} case${fullCases!==1?'s':''}</td>
              <td class="loose-cell">${looseRem>0?looseRem+' pcs':'—'}</td>
            </tr></tfoot>
          </table>
        </div>
      </div>`;

      for (let i = 0; i < labels.length; i += 8) {
        const page = document.createElement('div');
        page.className = 'page';
        for (let j = i; j < Math.min(i+8, labels.length); j++) {
          page.innerHTML += makeLbl(labels[j]);
        }
        section.appendChild(page);
      }

      container.appendChild(section);
    });

    tabBar.appendChild(group);
  });

  document.getElementById('stat').textContent =
    `${document.querySelectorAll('.tab-btn').length} drop-off tabs · ${totalLabels.toLocaleString()} total labels · ${CASE} pcs/case`;
}

function toggleInfo(id) {
  const wrap = document.getElementById(id);
  const btn = wrap.previousElementSibling;
  const open = wrap.classList.toggle('open');
  btn.textContent = btn.textContent.replace(/^[▶▼]/, open ? '▼' : '▶');
}

function printActiveTab() { doPrint('active'); }

function doPrint(forceScope) {
  const scope = forceScope || document.getElementById('selPrintScope').value;
  const allSections = document.querySelectorAll('.tab-section');

  if (scope === 'active') {
    const active = document.querySelector('.tab-section.visible');
    if (!active) return;
    active.classList.add('printing');
    window.print();
    active.classList.remove('printing');

  } else if (scope === 'truck') {
    // Find which truck the active tab belongs to — derive from its id prefix
    const active = document.querySelector('.tab-section.visible');
    if (!active) return;
    // id format: tab-{truckId}-{dIdx}  e.g. tab-t1-2
    const parts = active.id.split('-'); // ['tab','t1','2']
    const truckId = parts[1];
    allSections.forEach(s => {
      if (s.id.startsWith(`tab-${truckId}-`)) s.classList.add('printing');
    });
    window.print();
    allSections.forEach(s => s.classList.remove('printing'));

  } else {
    // all
    allSections.forEach(s => s.classList.add('printing'));
    window.print();
    allSections.forEach(s => s.classList.remove('printing'));
  }
}

buildTabs();
